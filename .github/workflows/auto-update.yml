name: IPTV 自动更新
on:
  schedule:
    - cron: '0 17 */5 * *'  # UTC 17:00 = 北京时间 次日 01:00 | 每5天运行一次
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 👈 强制设置：超过1小时自动终止任务
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖（ffmpeg + requests）
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          pip install requests

      - name: 运行主程序
        run: python main.py  # 👈 明确程序入口

      - name: 提交并推送更新结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --quiet || git commit -m "自动更新直播源 $(date +'%Y-%m-%d %H:%M')"
          git push