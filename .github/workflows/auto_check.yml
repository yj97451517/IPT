name: IPTV直播源自动筛选

on:
  schedule:
    # 北京时间 每5天 凌晨 2 点左右运行
    # UTC 时间 18:00 = 北京时间 次日 02:00
    - cron: '0 18 */5 * *'
  workflow_dispatch: # 允许手动触发

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 总运行不超过1小时，超时自动终止
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install ffmpeg & ffprobe
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: Run IPTV check script
        run: python main.py

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add config/input.txt output/
          git commit -m "Auto update IPTV sources $(date +'%Y-%m-%d %H:%M:%S')" || exit 0

      - name: Push to repo
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main